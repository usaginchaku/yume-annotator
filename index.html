<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>夢小説アノテーションツール Ver. 1.5</title>
<style>
  :root {
    --bg:#f7f4f1; --panel:#fffdfb; --text:#2f2926; --muted:#7a6f69; --line:#e7ded8;
    --accent:#7c5c57; --accent-2:#efe4df; --danger:#b94a48; --shadow:0 8px 30px rgba(63,45,39,.08);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif; }
  button,input,textarea,select { font:inherit; }
  button { touch-action:manipulation; }
  .app { min-height:100vh; }
  .topbar { position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px; padding:10px max(12px,env(safe-area-inset-left)) 10px max(12px,env(safe-area-inset-right)); background:rgba(247,244,241,.94); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
  .brand { font-weight:800; letter-spacing:.02em; flex:1; }
  .top-actions { display:flex; gap:8px; }
  .btn { border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:12px; padding:10px 13px; min-height:44px; cursor:pointer; }
  .btn.primary { background:var(--accent); color:white; border-color:var(--accent); }
  .btn.danger { color:var(--danger); border-color:#e8caca; }
  .btn.ghost { background:transparent; }
  .btn.small { min-height:36px; padding:7px 10px; border-radius:10px; font-size:14px; }
  main { width:min(940px,100%); margin:0 auto; padding:18px 14px calc(110px + var(--safe-bottom)); }
  .view[hidden] { display:none !important; }
  h1,h2,h3,p { margin-top:0; }
  .hero { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; }
  .hero h1 { font-size:25px; margin-bottom:5px; }
  .subtle { color:var(--muted); font-size:14px; }
  .toolbar { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:8px; margin-bottom:14px; }
  .field, .toolbar input, .toolbar select { width:100%; min-height:44px; padding:10px 12px; border:1px solid var(--line); background:var(--panel); border-radius:12px; color:var(--text); }
  .cards { display:grid; gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:15px; box-shadow:var(--shadow); }
  .work-card { cursor:pointer; }
  .work-card:active { transform:scale(.995); }
  .card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .card-title { font-weight:800; font-size:18px; margin-bottom:4px; }
  .badges { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 0; }
  .badge { display:inline-flex; align-items:center; min-height:26px; padding:4px 8px; border-radius:999px; background:#f2ece8; color:#5f524c; font-size:12px; font-weight:700; }
  .badge.old { background:#e9edf7; color:#485b86; }
  .badge.new { background:#f6e7ed; color:#8a4c62; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; color:var(--muted); font-size:13px; }
  .empty { padding:34px 18px; text-align:center; color:var(--muted); background:var(--panel); border:1px dashed var(--line); border-radius:16px; }
  .reader-header { margin-bottom:15px; }
  .reader-title-row { display:flex; gap:10px; align-items:flex-start; }
  .reader-title-row .btn { flex:0 0 auto; }
  .reader-meta { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .reader-actions { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
  .work-note { width:100%; min-height:86px; resize:vertical; }
  .text-wrap { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:20px 17px; box-shadow:var(--shadow); }
  #readerText { white-space:pre-wrap; word-break:break-word; font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif; font-size:17px; line-height:1.95; user-select:text; -webkit-user-select:text; }
  mark.annotation { padding:0; border-radius:3px; cursor:pointer; }
  mark.r3 { background:#ffd4df; }
  mark.r2 { background:#ffe3ea; }
  mark.r1 { background:#fff0f3; }
  mark.r0 { background:#eee8c8; }
  mark.rn1 { background:#ead3d1; text-decoration:underline wavy #a63d3b 1px; text-underline-offset:3px; }
  .app-version { font-size:.68em; font-weight:700; color:var(--muted); white-space:nowrap; }
  .bottom-eval { position:fixed !important; left:0; right:0; bottom:0 !important; top:auto !important; z-index:40; padding:10px max(12px,env(safe-area-inset-right)) calc(10px + var(--safe-bottom)) max(12px,env(safe-area-inset-left)); background:linear-gradient(to top,rgba(247,244,241,1) 74%,rgba(247,244,241,.92)); border-top:1px solid var(--line); }
  .bottom-eval-inner { width:min(940px,100%); margin:auto; display:flex; gap:8px; }
  #evaluateSelectionBtn { width:100%; font-weight:800; }
  #selectionStatus { flex:0 0 auto; align-self:center; color:var(--muted); font-size:12px; max-width:30%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  dialog { width:min(620px,calc(100% - 24px)); max-height:88vh; border:0; border-radius:18px; padding:0; box-shadow:0 30px 90px rgba(28,20,18,.26); color:var(--text); }
  dialog::backdrop { background:rgba(36,28,25,.42); backdrop-filter:blur(2px); }
  .modal { padding:18px; background:var(--panel); }
  .modal h2 { font-size:20px; margin-bottom:14px; }
  .annotation-modal-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .annotation-modal-head h2 { margin:0; }
  .modal-close-x { flex:0 0 auto; width:44px; height:44px; min-height:44px; padding:0; display:grid; place-items:center; border:0; background:transparent; color:var(--muted); border-radius:999px; font-size:30px; line-height:1; cursor:pointer; }
  .modal-close-x:active { background:#f2ece8; }
  .form-grid { display:grid; gap:12px; }
  .label { display:grid; gap:6px; color:#514843; font-size:13px; font-weight:700; }
  textarea.field { min-height:130px; resize:vertical; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .rating-row { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; }
  .rating-btn { min-height:50px; border:1px solid var(--line); background:#fff; border-radius:12px; font-size:17px; cursor:pointer; }
  .rating-btn.selected { outline:3px solid rgba(124,92,87,.22); border-color:var(--accent); background:var(--accent-2); }
  .quote-box { max-height:130px; overflow:auto; padding:10px 11px; border-radius:12px; background:#f6f1ee; color:#574b46; white-space:pre-wrap; font-family:"Hiragino Mincho ProN","Yu Mincho",serif; font-size:14px; line-height:1.7; }
  .anno-list { display:grid; gap:10px; }
  .anno-item { border:1px solid var(--line); border-radius:14px; padding:12px; background:#fff; }
  .anno-quote { font-family:"Hiragino Mincho ProN","Yu Mincho",serif; line-height:1.65; margin:7px 0; white-space:pre-wrap; }
  .anno-comment { color:#544a45; white-space:pre-wrap; }
  .anno-actions { display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; }
  .toast { position:fixed; top:72px; left:50%; transform:translateX(-50%); z-index:100; background:#2f2926; color:#fff; padding:10px 14px; border-radius:999px; font-size:13px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:.18s; }
  .toast.show { opacity:1; }
  .file-input { display:none; }
  .danger-zone { border-top:1px solid var(--line); margin-top:16px; padding-top:16px; }
  #workDialog { overflow:hidden; }
  #workDialog .modal { display:flex; flex-direction:column; max-height:88dvh; overflow:hidden; padding:0; }
  .work-modal-head { flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:14px 16px 10px; border-bottom:1px solid var(--line); background:var(--panel); }
  .work-modal-head h2 { margin:0; font-size:20px; flex:1; min-width:0; }
  .work-modal-head .btn { flex:0 0 auto; }
  #workDialogFileBtn { font-size:13px; padding-inline:10px; }
  #workForm { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  .work-fields { flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:14px 16px 22px; display:grid; gap:12px; touch-action:pan-y; }
  .work-actions { flex:0 0 auto; display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px 16px calc(10px + var(--safe-bottom)); margin:0; border-top:1px solid var(--line); background:rgba(255,253,251,.97); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .work-actions .btn { min-height:48px; font-weight:800; }
  #workDeleteArea { flex:0 0 auto; margin:0; padding:10px 16px calc(10px + var(--safe-bottom)); background:var(--panel); }
  #workText { min-height:320px !important; line-height:1.75; }
  @media (max-width:680px) {
    .topbar { padding-top:max(8px,env(safe-area-inset-top)); }
    .brand { font-size:15px; }
    .top-actions .label-text { display:none; }
    main { padding-top:14px; }
    .hero { align-items:center; }
    .hero h1 { font-size:21px; }
    .toolbar { grid-template-columns:1fr 1fr; }
    .toolbar input { grid-column:1 / -1; }
    .rating-row { grid-template-columns:repeat(5,minmax(0,1fr)); }
    .rating-btn { font-size:15px; padding:6px 2px; }
    #readerText { font-size:17px; line-height:2; }
    .text-wrap { padding:18px 15px; border-radius:15px; }
    #workDialog { width:calc(100% - 16px); max-width:none; height:calc(100dvh - 16px); max-height:calc(100dvh - 16px); margin:auto; border-radius:20px; }
    #workDialog .modal { height:100%; max-height:none; }
    .work-modal-head { padding-top:max(14px, env(safe-area-inset-top)); }
    .work-fields { padding:14px 16px 28px; }
    .work-actions { padding-left:16px; padding-right:16px; }
    #workText { min-height:42dvh !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">夢小説アノテーション <span class="app-version">Ver. 1.5</span></div>
    <div class="top-actions">
      <button class="btn small" id="exportJsonBtn">JSON<span class="label-text">出力</span></button>
      <button class="btn small" id="importJsonBtn">JSON<span class="label-text">読込</span></button>
      <button class="btn small" id="exportMdBtn">MD<span class="label-text">出力</span></button>
      <input id="importFile" class="file-input" type="file" accept="application/json,.json">
    </div>
  </header>
  <main>
    <section id="listView" class="view">
      <div class="hero"><div><h1>作品一覧</h1><div class="subtle">本文を読みながら「萌え／萎え」をその場で記録します。</div></div><button class="btn primary" id="newWorkBtn">＋ 新規作品</button></div>
      <div class="toolbar"><input id="searchInput" type="search" placeholder="タイトル・キャラクター・作品名を検索"><select id="characterFilter"><option value="">全キャラ</option></select><select id="versionFilter"><option value="">OLD / NEW</option><option value="old">OLD</option><option value="new">NEW</option></select></div>
      <div id="workList" class="cards"></div>
    </section>
    <section id="readerView" class="view" hidden>
      <div class="reader-header">
        <div class="reader-title-row"><button class="btn small" id="backBtn">← 一覧</button><div style="min-width:0;flex:1"><h1 id="readerTitle" style="margin-bottom:4px"></h1><div id="readerMeta" class="reader-meta"></div></div></div>
        <div class="reader-actions"><button class="btn small" id="editWorkBtn">作品情報を編集</button><button class="btn small" id="annotationsBtn">アノテーション一覧</button></div>
        <label class="label">全体メモ<textarea id="readerNotes" class="field work-note" placeholder="作品全体への感想・比較メモなど"></textarea></label>
      </div>
      <div class="text-wrap"><div id="readerText"></div></div>
    </section>
  </main>
  <div id="bottomEval" class="bottom-eval" hidden><div class="bottom-eval-inner"><button class="btn primary" id="evaluateSelectionBtn">この部分を評価</button><div id="selectionStatus">本文を選択してください</div></div></div>
</div>
<dialog id="newWorkChoiceDialog"><div class="modal"><h2>新規作品を追加</h2><div class="form-grid"><button type="button" class="btn primary" id="newWorkDirectBtn">直接入力</button><button type="button" class="btn" id="newWorkFileBtn">ファイルから読み込み</button><div class="subtle">.txt / .md の本文を読み込み、作品情報を入力して保存できます。</div><input id="newWorkTextFile" class="file-input" type="file" accept="text/plain,text/markdown,.txt,.md"></div><div class="modal-actions"><button type="button" class="btn" data-close="newWorkChoiceDialog">キャンセル</button></div></div></dialog>
<dialog id="workDialog"><div class="modal"><div class="work-modal-head"><button type="button" class="btn small ghost" data-close="workDialog" aria-label="閉じる" autofocus>←</button><h2 id="workDialogTitle">作品を追加</h2><button type="button" class="btn small" id="workDialogFileBtn">ファイルから読み込み</button><input id="workDialogTextFile" class="file-input" type="file" accept="text/plain,text/markdown,.txt,.md"></div><form id="workForm"><div class="work-fields"><input type="hidden" id="workId"><label class="label">タイトル *<input class="field" id="workTitle" required></label><label class="label">キャラクター *<input class="field" id="workCharacter" list="characterSuggestions" autocomplete="off" required></label><label class="label">プロンプト種別 *<select class="field" id="workVersion" required><option value="old">OLD</option><option value="new">NEW</option></select></label><label class="label">作品名 / シリーズ<input class="field" id="workSeries" list="seriesSuggestions" autocomplete="off"></label><details><summary>詳細設定（任意）</summary><div class="form-grid" style="margin-top:12px"><label class="label">比較ペアID（任意）<input class="field" id="workPair" list="pairSuggestions" autocomplete="off" placeholder="例: dio-001"></label><label class="label">シチュエーション（任意）<input class="field" id="workScenario"></label></div></details><label class="label">本文 *<textarea class="field" id="workText" required></textarea></label><datalist id="characterSuggestions"></datalist><datalist id="seriesSuggestions"></datalist><datalist id="pairSuggestions"></datalist></div><div class="work-actions"><button type="button" class="btn" data-close="workDialog">キャンセル</button><button type="submit" class="btn primary">保存</button></div></form><div id="workDeleteArea" class="danger-zone" hidden><button id="deleteWorkBtn" class="btn danger">この作品を削除</button></div></div></dialog>
<dialog id="annotationDialog" tabindex="-1"><div class="modal"><div class="annotation-modal-head"><h2 id="annotationDialogTitle">この部分を評価</h2><button type="button" class="modal-close-x" data-close="annotationDialog" aria-label="閉じる" autofocus>×</button></div><div id="annotationQuote" class="quote-box"></div><div class="form-grid" style="margin-top:12px"><label class="label">評価<div class="rating-row" id="ratingRow"><button type="button" class="rating-btn" data-rating="3" aria-label="死ぬほど好き">❤️❤️❤️</button><button type="button" class="rating-btn" data-rating="2" aria-label="かなり好き">❤️❤️</button><button type="button" class="rating-btn" data-rating="1" aria-label="好き">❤️</button><button type="button" class="rating-btn" data-rating="0" aria-label="普通・気になる">△</button><button type="button" class="rating-btn" data-rating="-1" aria-label="萎え・嫌い">❌</button></div></label><label class="label">コメント（空欄可）<textarea id="annotationComment" class="field" readonly tabindex="-1" placeholder="承太郎すぎる、ここ最高、展開が早い…"></textarea></label></div><div class="modal-actions"><button type="button" class="btn" data-close="annotationDialog">キャンセル</button><button type="button" class="btn primary" id="saveAnnotationBtn">保存</button></div></div></dialog>
<dialog id="annotationsDialog" tabindex="-1"><div class="modal"><div class="annotation-modal-head"><h2>アノテーション一覧</h2><button type="button" class="modal-close-x" data-close="annotationsDialog" aria-label="閉じる" autofocus>×</button></div><label class="label" style="margin-bottom:12px">評価で絞り込み<select id="annotationFilter" class="field"><option value="">すべて</option><option value="3">❤️❤️❤️</option><option value="2">❤️❤️</option><option value="1">❤️</option><option value="0">△</option><option value="-1">❌</option></select></label><div id="annotationList" class="anno-list"></div><div class="modal-actions"><button type="button" class="btn" data-close="annotationsDialog">閉じる</button></div></div></dialog>
<dialog id="annotationEditDialog"><div class="modal"><h2>アノテーション編集</h2><div id="editAnnotationQuote" class="quote-box"></div><div class="form-grid" style="margin-top:12px"><label class="label">評価<select id="editAnnotationRating" class="field"><option value="3">❤️❤️❤️</option><option value="2">❤️❤️</option><option value="1">❤️</option><option value="0">△</option><option value="-1">❌</option></select></label><label class="label">コメント<textarea id="editAnnotationComment" class="field"></textarea></label></div><div class="modal-actions"><button type="button" class="btn" data-close="annotationEditDialog">キャンセル</button><button type="button" class="btn primary" id="updateAnnotationBtn">保存</button></div><div class="danger-zone"><button type="button" class="btn danger" id="deleteAnnotationBtn">このアノテーションを削除</button></div></div></dialog>
<div id="toast" class="toast"></div>
<script>
(() => {
  'use strict';
  const STORAGE_KEY = 'yumeAnnotationTool.v1';
  const $ = id => document.getElementById(id);
  const nowIso = () => new Date().toISOString();
  const uid = prefix => `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;
  const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ratingLabel = r => ({'3':'❤️❤️❤️','2':'❤️❤️','1':'❤️','0':'△','-1':'❌'})[String(r)] ?? '';
  const ratingClass = r => r === 3 ? 'r3' : r === 2 ? 'r2' : r === 1 ? 'r1' : r === 0 ? 'r0' : 'rn1';
  const uniqueSorted = values => [...new Set(values.filter(Boolean).map(v => String(v).trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
  function refreshWorkSuggestions() {
    const fill = (id, values) => { const el=$(id); if(el) el.innerHTML=uniqueSorted(values).map(v=>`<option value="${escapeHtml(v)}"></option>`).join(''); };
    fill('characterSuggestions', state.works.map(w=>w.character));
    fill('seriesSuggestions', state.works.map(w=>w.series));
    fill('pairSuggestions', state.works.map(w=>w.pair_id));
  }
  function inferPromptVersionFromFilename(name) {
    const base=String(name||'').replace(/\.(txt|md)$/i,'');
    if (base.includes('新_')) return 'new';
    if (base.includes('旧_')) return 'old';
    return null;
  }
  let state = loadState();
  let currentWorkId = null;
  let pendingSelection = null;
  let selectedRating = null;
  let editingAnnotationId = null;
  let notesTimer = null;
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { schema_version:1, works:[] };
      return normalizeState(JSON.parse(raw));
    } catch (e) { console.error(e); return { schema_version:1, works:[] }; }
  }
  function normalizeState(data) {
    const works = Array.isArray(data?.works) ? data.works : [];
    return { schema_version:1, works:works.map(w => ({
      id:w.id || uid('work'), title:w.title || '', character:w.character || '', prompt_version:w.prompt_version === 'new' ? 'new' : 'old', full_text:w.full_text || '', series:w.series || '', pair_id:w.pair_id || '', scenario:w.scenario || '', notes:w.notes || '', created_at:w.created_at || nowIso(), updated_at:w.updated_at || nowIso(), annotations:Array.isArray(w.annotations) ? w.annotations.map(a => ({ id:a.id || uid('annotation'), work_id:w.id || '', quote:a.quote || '', start:Number(a.start)||0, end:Number(a.end)||0, rating:[-1,0,1,2,3].includes(Number(a.rating)) ? Number(a.rating) : 0, comment:a.comment || '', created_at:a.created_at || nowIso(), updated_at:a.updated_at || nowIso() })) : []
    }))};
  }
  function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { alert('保存に失敗しました。Safariのストレージ容量をご確認ください。\n' + e.message); } }
  function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1800); }
  function getWork() { return state.works.find(w => w.id === currentWorkId) || null; }
  function showView(name) { $('listView').hidden = name !== 'list'; $('readerView').hidden = name !== 'reader'; $('bottomEval').hidden = name !== 'reader'; }
  function renderList() {
    const q = $('searchInput').value.trim().toLowerCase(), char = $('characterFilter').value, ver = $('versionFilter').value;
    const chars = [...new Set(state.works.map(w => w.character).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja')), previous = $('characterFilter').value;
    $('characterFilter').innerHTML = '<option value="">全キャラ</option>' + chars.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join(''); if (chars.includes(previous)) $('characterFilter').value = previous;
    const filtered = state.works.filter(w => { const hay = `${w.title} ${w.character} ${w.series}`.toLowerCase(); return (!q || hay.includes(q)) && (!char || w.character === char) && (!ver || w.prompt_version === ver); }).sort((a,b) => (b.updated_at || '').localeCompare(a.updated_at || ''));
    const list = $('workList'); if (!filtered.length) { list.innerHTML = '<div class="empty">該当する作品がありません。<br>「＋ 新規作品」から本文を登録できます。</div>'; return; }

  function openReader(id) {
    currentWorkId = id; pendingSelection = null; window.getSelection()?.removeAllRanges(); const w = getWork(); if (!w) return;

  function getSelectionOffsets() {

  }
  function syncBottomEvalToVisualViewport() { const bar = $('bottomEval'); if (!bar || bar.hidden || $('readerView').hidden) return; bar.style.position = 'fixed'; bar.style.top = 'auto'; bar.style.bottom = '0px'; bar.style.left = '0'; bar.style.right = '0'; }

  $('evaluateSelectionBtn').addEventListener('click', () => {
    const s = getSelectionOffsets() || pendingSelection; if (!s) { toast('先に本文の範囲を選択してください'); return; } pendingSelection = s; selectedRating = null; $('annotationQuote').textContent = s.quote; const commentBox = $('annotationComment'); commentBox.value=''; commentBox.readOnly = true; commentBox.tabIndex = -1; document.querySelectorAll('#ratingRow .rating-btn').forEach(b => b.classList.remove('selected')); $('annotationDialog').showModal(); const closeBtn = $('annotationDialog').querySelector('.modal-close-x'); requestAnimationFrame(() => { try { closeBtn?.focus({preventScroll:true}); } catch (_) { closeBtn?.focus(); } setTimeout(() => { commentBox.readOnly = false; commentBox.tabIndex = 0; }, 180); });
  });
  document.querySelectorAll('#ratingRow .rating-btn').forEach(btn => btn.addEventListener('click', () => { selectedRating = Number(btn.dataset.rating); document.querySelectorAll('#ratingRow .rating-btn').forEach(b => b.classList.toggle('selected', b === btn)); }));
  function closeAnnotationDialog() { if (document.activeElement instanceof HTMLElement) document.activeElement.blur(); const dialog = $('annotationDialog'); if (dialog.open) dialog.close(); requestAnimationFrame(() => { if (dialog.open) dialog.close(); }); }
  $('saveAnnotationBtn').addEventListener('click', () => {
    const w = getWork(); if (!w) { toast('作品を読み込めませんでした'); return; } if (!pendingSelection) { toast('選択範囲が失われました。もう一度本文を選択してください'); return; } const selectionToSave = {...pendingSelection}; if (selectedRating === null) { toast('評価を選んでください'); return; } const quote = w.full_text.slice(selectionToSave.start,selectionToSave.end); if (quote !== selectionToSave.quote) { toast('選択位置が変わりました。もう一度選択してください'); closeAnnotationDialog(); return; } const t = nowIso(); w.annotations.push({ id:uid('annotation'), work_id:w.id, quote, start:selectionToSave.start, end:selectionToSave.end, rating:selectedRating, comment:$('annotationComment').value.trim(), created_at:t, updated_at:t }); w.updated_at=t; saveState(); closeAnnotationDialog(); window.getSelection()?.removeAllRanges(); pendingSelection=null; renderAnnotatedText(w); renderAnnotationList(); ensureEvaluationBarVisible(); toast('アノテーションを保存しました');

  function openAnnotationEdit(id) { const w=getWork(), a=w?.annotations.find(x=>x.id===id); if(!a) return; editingAnnotationId=id; $('editAnnotationQuote').textContent=a.quote; $('editAnnotationRating').value=String(a.rating); $('editAnnotationComment').value=a.comment||''; $('annotationEditDialog').showModal(); }
  $('updateAnnotationBtn').addEventListener('click', () => { const w=getWork(), a=w?.annotations.find(x=>x.id===editingAnnotationId); if(!a) return; a.rating=Number($('editAnnotationRating').value); a.comment=$('editAnnotationComment').value.trim(); a.updated_at=nowIso(); w.updated_at=nowIso(); saveState(); $('annotationEditDialog').close(); renderAnnotatedText(w); renderAnnotationList(); toast('更新しました'); });
  $('deleteAnnotationBtn').addEventListener('click', () => { const w=getWork(); if(!w) return; const a=w.annotations.find(x=>x.id===editingAnnotationId); if(!a || !confirm('このアノテーションを削除しますか？')) return; w.annotations=w.annotations.filter(x=>x.id!==editingAnnotationId); w.updated_at=nowIso(); saveState(); $('annotationEditDialog').close(); renderAnnotatedText(w); renderAnnotationList(); toast('削除しました'); });
  function renderAnnotationList() {
    const w=getWork(); if(!w) return; const f=$('annotationFilter').value, items=[...(w.annotations||[])].filter(a=>f===''||String(a.rating)===f).sort((a,b)=>a.start-b.start);
    $('annotationList').innerHTML = items.length ? items.map(a=>`<div class="anno-item"><div><strong>${ratingLabel(a.rating)}</strong> <span class="subtle">${a.start}–${a.end}</span></div><div class="anno-quote">${escapeHtml(a.quote)}</div>${a.comment?`<div class="anno-comment">${escapeHtml(a.comment)}</div>`:''}<div class="anno-actions"><button class="btn small" data-jump="${escapeHtml(a.id)}">本文へ</button><button class="btn small" data-edit-ann="${escapeHtml(a.id)}">編集</button></div></div>`).join('') : '<div class="empty">該当するアノテーションはありません。</div>';
    $('annotationList').querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>{ $('annotationsDialog').close(); const el=$(`ann-${b.dataset.jump}`); if(el){el.scrollIntoView({behavior:'smooth',block:'center'}); setTimeout(()=>openAnnotationEdit(b.dataset.jump),350);} else toast('重複範囲のため本文ハイライト非表示です'); })); $('annotationList').querySelectorAll('[data-edit-ann]').forEach(b=>b.addEventListener('click',()=>openAnnotationEdit(b.dataset.editAnn)));
  }
  $('annotationsBtn').addEventListener('click',()=>{ $('annotationFilter').value=''; renderAnnotationList(); $('annotationsDialog').showModal(); requestAnimationFrame(() => { const closeBtn = $('annotationsDialog').querySelector('.modal-close-x'); try { closeBtn?.focus({preventScroll:true}); } catch (_) { closeBtn?.focus(); } }); }); $('annotationFilter').addEventListener('change',renderAnnotationList);
  $('newWorkBtn').addEventListener('click',()=>{ $('newWorkChoiceDialog').showModal(); }); $('newWorkDirectBtn').addEventListener('click',()=>{ $('newWorkChoiceDialog').close(); openWorkDialog(); }); $('newWorkFileBtn').addEventListener('click',()=>{ $('newWorkTextFile').click(); });
  $('newWorkTextFile').addEventListener('change', async e => {
    const file = e.target.files?.[0]; if (!file) return;
    try { const lower = file.name.toLowerCase(); if (!(lower.endsWith('.txt') || lower.endsWith('.md'))) throw new Error('対応形式は .txt / .md です。'); const text = await file.text(); if (!text.trim()) throw new Error('ファイルの本文が空です。'); const suggestedTitle = file.name.replace(/\.(txt|md)$/i, ''); const inferredVersion = inferPromptVersionFromFilename(file.name); $('newWorkChoiceDialog').close(); openWorkDialog(null, { title:suggestedTitle, full_text:text, ...(inferredVersion ? {prompt_version:inferredVersion} : {}) }); toast(inferredVersion ? `本文を読み込み、${inferredVersion.toUpperCase()} と判定しました` : '本文を読み込みました'); }
    catch (err) { alert('ファイルの読み込みに失敗しました。\n' + err.message); } finally { e.target.value = ''; }
  });
  $('workDialogFileBtn').addEventListener('click',()=>{ $('workDialogTextFile').click(); });
  $('workDialogTextFile').addEventListener('change', async e => {
    const file = e.target.files?.[0]; if (!file) return;
    try { const lower = file.name.toLowerCase(); if (!(lower.endsWith('.txt') || lower.endsWith('.md'))) throw new Error('対応形式は .txt / .md です。'); const text = await file.text(); if (!text.trim()) throw new Error('ファイルの本文が空です。'); $('workText').value = text; if (!$('workTitle').value.trim()) $('workTitle').value = file.name.replace(/\.(txt|md)$/i, ''); const inferredVersion = inferPromptVersionFromFilename(file.name); if (inferredVersion) $('workVersion').value = inferredVersion; toast(inferredVersion ? `本文を読み込み、${inferredVersion.toUpperCase()} と判定しました` : '本文を読み込みました'); }
    catch (err) { alert('ファイルの読み込みに失敗しました。\n' + err.message); } finally { e.target.value = ''; }

  $('editWorkBtn').addEventListener('click',()=>openWorkDialog(getWork()));
  function openWorkDialog(w=null, seed=null){

  }
  $('workForm').addEventListener('submit',e=>{
    e.preventDefault(); const id=$('workId').value, existing=state.works.find(w=>w.id===id), t=nowIso(); const payload={ title:$('workTitle').value.trim(), character:$('workCharacter').value.trim(), prompt_version:$('workVersion').value, series:$('workSeries').value.trim(), pair_id:$('workPair').value.trim(), scenario:$('workScenario').value.trim(), full_text:$('workText').value };

  $('readerNotes').addEventListener('input',()=>{ clearTimeout(notesTimer); notesTimer=setTimeout(()=>{const w=getWork(); if(!w)return; w.notes=$('readerNotes').value; w.updated_at=nowIso(); saveState();},350); }); $('backBtn').addEventListener('click',()=>{ const w=getWork(); if(w){w.notes=$('readerNotes').value; saveState();} currentWorkId=null; showView('list'); renderList(); });
  function exportDataForLLM() { return { schema_version:1, exported_at:nowIso(), works:state.works.map(w=>({ id:w.id,title:w.title,series:w.series,character:w.character,prompt_version:w.prompt_version,pair_id:w.pair_id,scenario:w.scenario,notes:w.notes,full_text:w.full_text,annotations:(w.annotations||[]).map(a=>({id:a.id,quote:a.quote,start:a.start,end:a.end,rating:a.rating,comment:a.comment,created_at:a.created_at,updated_at:a.updated_at})),created_at:w.created_at,updated_at:w.updated_at })) }; }
